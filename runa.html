<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ficha de Runa · Futhark</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="nav"><div class="wrap navin"><a class="brand" href="index.html"><span>ᚠ</span>FUTHARK</a><nav class="links"><a href="oraculo.html">Oráculo</a><a href="runas.html">Runas</a><a href="mapa.html">Mapa</a><a href="atlas.html">Yggdrasil</a><a href="povos.html">Povos & Seres</a><a href="cosmologia.html">Cosmologia</a></nav></div></header><main class="wrap"><section class="section" id="detail"><p>Carregando ficha…</p></section></main><footer class="footer"><div class="wrap">FUTHARK · Atlas simbólico das runas.</div></footer><script src="data/runes.js"></script><script src="data/groups.js"></script><script>const id=Number(new URLSearchParams(location.search).get('id'))||1,r=RUNES.find(x=>x.id===id)||RUNES[0],rel=RUNES.filter(x=>x.id!==r.id&&(x.force===r.force||x.group===r.group||x.world===r.world)).slice(0,5);document.getElementById('detail').innerHTML=`<a class="small" href="runas.html">← Voltar ao Livro das Runas</a><div class="hero" style="padding-top:30px"><div class="glyph" style="font-size:5rem">${r.symbol}</div><div class="eyebrow">Ficha ${r.id} · Elder Futhark</div><h1>${r.name}</h1><p>${r.meaning}</p><span class="tag">Som: ${r.sound}</span><span class="tag">${r.force}</span><span class="tag">${r.group}</span><span class="tag">${r.world}</span></div><div class="columns"><article class="card light"><h3>☼ Luz · potência construtiva</h3><ul>${r.light.map(x=>`<li>${x}</li>`).join('')}</ul></article><article class="card shadow"><h3>☾ Sombra · tensão possível</h3><ul>${r.shadow.map(x=>`<li>${x}</li>`).join('')}</ul></article></div><section class="section"><h2>Rede de relações</h2><div class="path"><span>${r.symbol} ${r.name}</span><b>→</b><span>${r.force}</span><b>→</b><span>${r.figure}</span><b>→</b><span>${r.world}</span></div><p class="small">Esta cadeia é uma estrutura simbólica do projeto, não uma correspondência histórica universalmente atestada.</p></section><section class="section"><h2>Runas próximas</h2><div class="grid">${rel.map(x=>`<a class="card" href="runa.html?id=${x.id}"><div class="glyph">${x.symbol}</div><h3>${x.name}</h3><p>${x.meaning}</p></a>`).join('')}</div></section><div class="notice">As polaridades de luz/sombra e o uso oracular são ferramentas contemporâneas de reflexão.</div>`;</script></body></html>
