<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runas · Futhark</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="nav"><div class="wrap navin"><a class="brand" href="index.html"><span>ᚠ</span>FUTHARK</a><nav class="links"><a href="oraculo.html">Oráculo</a><a href="runas.html">Runas</a><a href="mapa.html">Mapa</a><a href="atlas.html">Yggdrasil</a><a href="povos.html">Povos & Seres</a><a href="cosmologia.html">Cosmologia</a></nav></div></header><main class="wrap"><section class="section"><div class="eyebrow">Livro das Runas</div><h2>As 24 runas</h2><p class="muted">Pesquise por nome, símbolo, som, força ou figura.</p><input id="search" class="search" placeholder="Buscar uma runa, força ou figura…"><div id="runes" class="grid"></div></section></main><footer class="footer"><div class="wrap">FUTHARK · Atlas simbólico das runas.</div></footer><script src="data/runes.js"></script><script src="data/groups.js"></script><script>const root=document.getElementById('runes'),s=document.getElementById('search');function render(){let q=s.value.toLowerCase(),a=RUNES.filter(r=>Object.values(r).flat().join(' ').toLowerCase().includes(q));root.innerHTML=a.map(r=>`<a class="card rune-card" href="runa.html?id=${r.id}"><div class="rune-top"><div class="glyph">${r.symbol}</div><div><h3>${r.name}</h3><div class="small">${r.sound} · ${r.force}</div></div></div><p style="margin-top:12px">${r.meaning}</p><span class="tag">${r.world}</span></a>`).join('')||'<p>Nenhuma runa encontrada.</p>'}s.addEventListener('input',render);render();</script></body></html>
